<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: the game may paint under the notch; the bottom
       stays protected by SAFE_BOTTOM (config.ts). -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#05040c" />
  <!-- Installed-app chrome on iOS (the manifest handles Android). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moonwick" />
  <title>Moonwick</title>
  <!-- The lit crescent at favicon size: the "tiny" recipe from the brand
       sheet — crescent thickened, flame rounded to a dot, because a hairline
       sliver and a teardrop both vanish below ~28 px. Inline SVG, no file. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0718'/%3E%3Cmask id='m'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ccircle cx='34' cy='56' r='34' fill='black'/%3E%3C/mask%3E%3Ccircle cx='50' cy='56' r='40' fill='%23f4eee0' mask='url(%23m)'/%3E%3Ccircle cx='77' cy='13' r='9' fill='%23ffd9a0'/%3E%3C/svg%3E"
  />
  <!-- The two faces of the art direction: a light high-contrast serif for the
       logo, titles and numerals, and a geometric sans for small-caps labels.
       main.ts awaits these before booting Phaser, so fitText/buttonWidth
       measure real glyphs in all four languages. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    html, body { margin: 0; padding: 0; background: #0b0716; height: 100%; overflow: hidden; }
    body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100%; height: 100dvh; }
    /* Portrait guard: a phone held sideways gets a wordless rotate glyph —
       an icon, not an instruction, so nothing here needs i18n. The height
       cap keeps desktop landscape windows (every desktop) out of it. */
    #rotate { position: fixed; inset: 0; z-index: 9; background: #05040c; display: none; align-items: center; justify-content: center; }
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    @keyframes rotate-nudge { 0%, 55% { transform: rotate(0deg); } 75%, 100% { transform: rotate(90deg); } }
    #rotate svg { width: 88px; height: 88px; animation: rotate-nudge 1.6s ease-in-out infinite alternate; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" aria-hidden="true">
    <svg viewBox="0 0 88 88" fill="none">
      <rect x="26" y="14" width="36" height="60" rx="7" stroke="#a08fd0" stroke-width="2.5" />
      <circle cx="44" cy="66" r="2.5" fill="#a08fd0" />
      <path d="M 70 30 A 26 26 0 0 1 70 58" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 66 52 L 70 58 L 76 55" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </svg>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
